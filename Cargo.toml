[package]
name = "tts-api"
version = "1.0.0"
edition = "2021"

[dependencies]
anyhow = "1"
axum = "0.8"
constant_time_eq = "0.4"
encoding_rs = "0.8"
hex = "0.4"
hound = "3.5"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "io-util", "fs", "net"] }
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
pretty_assertions = "1"
